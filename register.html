<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إنشاء حساب - MATBAKHNA</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
<a href="index.html" class="logo">MATBAKHNA<span>.</span></a>
</header>

<section class="section">

<h2>إنشاء حساب جديد</h2>

<form onsubmit="registerUser(event)">

<label>الاسم الكامل</label>
<input id="name" required>

<label>البريد الإلكتروني</label>
<input id="email" type="email" required>

<label>كلمة المرور</label>
<input id="password" type="password" minlength="8" required>

<label>نوع الحساب</label>
<select id="role">
<option value="customer">زبون</option>
<option value="cook">طباخة</option>
<option value="delivery">سائق توصيل</option>
</select>

<button class="button" type="submit">إنشاء الحساب</button>

<p>لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p>

</form>

</section>

<script src="js/app.js"></script>
</body>
</html>
