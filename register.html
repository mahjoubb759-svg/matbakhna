<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>إنشاء حساب | MATBAKHNA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header id="site-header"></header>

<section class="section container">

    <h1 class="section-title">إنشاء حساب جديد</h1>

    <p class="intro">انضم إلى مجتمع MATBAKHNA.</p>

    <form id="register-form">

        <label for="name">الاسم الكامل</label>
        <input
            type="text"
            id="name"
            required
            minlength="2"
            autocomplete="name"
        >

        <label for="email">البريد الإلكتروني</label>
        <input
            type="email"
            id="email"
            required
            autocomplete="email"
        >

        <label for="password">كلمة المرور</label>
        <input
            type="password"
            id="password"
            required
            minlength="8"
            autocomplete="new-password"
        >

        <label for="role">نوع الحساب</label>
        <select id="role" required>
            <option value="customer">زبون</option>
            <option value="cook">طباخة</option>
            <option value="driver">سائق توصيل</option>
        </select>

        <button class="button button-green form-button" type="submit">
            إنشاء الحساب
        </button>

        <p style="text-align:center;margin-top:15px">
            لديك حساب؟
            <a href="login.html" style="color:green">تسجيل الدخول</a>
        </p>

    </form>

    <div class="notice">
        الحسابات هنا تجريبية ومحفوظة في المتصفح الحالي فقط.
        لا تستخدم كلمة مرور حقيقية أو حساسة.
    </div>

</section>

<footer id="site-footer"></footer>

<script src="js/app.js" defer></script>
</body>
</html>
