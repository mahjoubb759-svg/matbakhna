<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>تسجيل الدخول | MATBAKHNA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header id="site-header"></header>

<section class="section container">

    <h1 class="section-title">تسجيل الدخول</h1>

    <p class="intro">مرحباً بعودتك إلى MATBAKHNA.</p>

    <form id="login-form">

        <label for="email">البريد الإلكتروني</label>
        <input
            type="email"
            id="email"
            required
            autocomplete="email"
        >

        <label for="password">كلمة المرور</label>
        <input
            type="password"
            id="password"
            required
            autocomplete="current-password"
        >

        <button class="button button-green form-button" type="submit">
            دخول
        </button>

        <p style="text-align:center;margin-top:15px">
            ليس لديك حساب؟
            <a href="register.html" style="color:green">أنشئ حساباً</a>
        </p>

    </form>

</section>

<footer id="site-footer"></footer>

<script src="js/app.js" defer></script>
</body>
</html>
