<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>سلة المشتريات | MATBAKHNA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header id="site-header"></header>

<section class="section container">

    <h1 class="section-title">سلة المشتريات</h1>

    <div id="cart-items"></div>

    <div class="cart-summary">
        <h3>المجموع: <span id="total">0</span></h3>
        <p>رسوم التوصيل غير محسوبة.</p>

        <br>

        <form id="order-form">

            <h2>معلومات التوصيل</h2>

            <label for="customer-name">الاسم الكامل</label>
            <input
                type="text"
                id="customer-name"
                required
                minlength="2"
            >

            <label for="customer-phone">رقم الهاتف</label>
            <input
                type="tel"
                id="customer-phone"
                required
                pattern="[0-9+ ()-]{8,20}"
            >

            <label for="customer-address">عنوان التوصيل</label>
            <textarea
                id="customer-address"
                required
                minlength="5"
            ></textarea>

            <button class="button button-green form-button" type="submit">
                تأكيد الطلب
            </button>

        </form>
    </div>

</section>

<footer id="site-footer"></footer>

<script src="js/app.js" defer></script>
</body>
</html>
